services:
  db-test:
    image: postgres:16-alpine
    container_name: gastos_db_test
    restart: unless-stopped
    environment:
      POSTGRES_USER: gastos
      POSTGRES_PASSWORD: gastos
      POSTGRES_DB: gastos_test
    ports:
      - "5433:5432"
    volumes:
      - postgres_test_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gastos -d gastos_test"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_test_data:
